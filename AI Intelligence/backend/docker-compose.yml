services:
  db:
    image: postgres:16
    container_name: oau_thesis_bank_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: oau_thesis_bank
      POSTGRES_USER: oau
      POSTGRES_PASSWORD: oau
    ports:
      - "5432:5432"
    volumes:
      - db_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oau -d oau_thesis_bank"]
      interval: 5s
      timeout: 5s
      retries: 5

  storage:
    image: rustfs/rustfs:latest
    container_name: oau_thesis_bank_storage
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-oau-thesis-access}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-oau-thesis-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  storage-init:
    build: .
    container_name: oau_thesis_bank_storage_init
    restart: "no"
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      storage:
        condition: service_healthy
    command: python scripts/init_storage.py
    environment:
      STORAGE_ENDPOINT_URL: http://storage:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-oau-thesis-access}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-oau-thesis-secret}
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME:-oau-thesis-bank}

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oau_thesis_bank_backend
    restart: unless-stopped
    command:
      - /app/.venv/bin/python
      - -c
      - |
        import os
        import sys
        import subprocess

        print("Python executable:", sys.executable, flush=True)
        import dotenv
        print("dotenv location:", dotenv.__file__, flush=True)

        commands = [
            [sys.executable, "manage.py", "wait_for_db"],
            [sys.executable, "manage.py", "migrate"],
            [sys.executable, "manage.py", "runserver", "0.0.0.0:8000"],
        ]

        for command in commands:
            print("Running:", " ".join(command), flush=True)
            result = subprocess.run(command, check=False)
            if result.returncode != 0:
                sys.exit(result.returncode)
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - backend_venv:/app/.venv
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    environment:
      DJANGO_DEBUG: "1"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: oau_thesis_bank
      POSTGRES_USER: oau
      POSTGRES_PASSWORD: oau
      AI_SERVICE_URL: http://host.docker.internal:8888
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-http://storage:9000}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-oau-thesis-access}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-oau-thesis-secret}
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME:-oau-thesis-bank}
      STORAGE_REGION: ${STORAGE_REGION:-}
      EMAIL_HOST: ""
      EMAIL_PORT: "1025"

volumes:
  db_pgdata:
    name: oau-thesis-bank_oau_thesis_bank_pgdata
  backend_venv:

  storage_data:
    name: oau-thesis-bank_storage_data
