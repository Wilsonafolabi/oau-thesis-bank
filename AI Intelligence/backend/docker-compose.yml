services:
  db:
    image: postgres:16
    container_name: oau_thesis_bank_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: oau_thesis_bank
      POSTGRES_USER: oau
      POSTGRES_PASSWORD: oau
    ports:
      - "5432:5432"
    volumes:
      - db_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oau -d oau_thesis_bank"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: oau_thesis_bank_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: oau
      MINIO_ROOT_PASSWORD: oau-thesis-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: oau_thesis_bank_minio_init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - mc alias set local http://minio:9000 oau oau-thesis-secret && mc mb --ignore-existing local/oau-thesis-bank

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oau_thesis_bank_backend
    restart: unless-stopped
    command:
      - /app/.venv/bin/python
      - -c
      - |
        import os
        import sys
        import subprocess

        print("Python executable:", sys.executable, flush=True)
        import dotenv
        print("dotenv location:", dotenv.__file__, flush=True)

        commands = [
            [sys.executable, "manage.py", "wait_for_db"],
            [sys.executable, "manage.py", "migrate"],
            [sys.executable, "manage.py", "runserver", "0.0.0.0:8000"],
        ]

        for command in commands:
            print("Running:", " ".join(command), flush=True)
            result = subprocess.run(command, check=False)
            if result.returncode != 0:
                sys.exit(result.returncode)
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - backend_venv:/app/.venv
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DJANGO_DEBUG: "1"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: oau_thesis_bank
      POSTGRES_USER: oau
      POSTGRES_PASSWORD: oau
      AI_SERVICE_URL: http://host.docker.internal:8888
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-http://minio:9000}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-oau}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-oau-thesis-secret}
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME:-oau-thesis-bank}
      STORAGE_REGION: ${STORAGE_REGION:-}
      EMAIL_HOST: ""
      EMAIL_PORT: "1025"

volumes:
  db_pgdata:
    name: oau-thesis-bank_oau_thesis_bank_pgdata
  minio_data:
  backend_venv:

