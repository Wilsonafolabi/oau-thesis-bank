[project]
name = "oau-ai-v2"
version = "3.0.0"
description = "OAU Thesis Bank Phase 3 — Research Intelligence (V2)"
requires-python = ">=3.11"
dependencies = [
    "greenlet>=2.0.0",
    "httpx>=0.27.0",
    "langchain-community>=0.3.0,<0.4.0",
    "langchain-core>=1.4.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "pyjwt[crypto]>=2.9.0",
    "sqlalchemy>=2.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "psycopg[binary]>=3.0",
    "pypdf>=3.0",
    "sentence-transformers>=2.0",
    "ragas>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "-q --disable-warnings"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["oau_ai*"]
